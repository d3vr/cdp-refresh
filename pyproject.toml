[project]
name = "cdp-refresh"
version = "0.1.0"
description = "A tool to watch local file changes and refresh a specific Chrome tab via CDP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "watchfiles>=0.20.0",
    "websockets>=11.0.3",
    "httpx>=0.24.1",
    "typer>=0.9.0",
    "rich>=13.5.2",
    "pydantic>=2.4.0",
    "prompt_toolkit>=3.0.38",
]

[project.scripts]
cdp-refresh = "cdp_refresh.cli:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
